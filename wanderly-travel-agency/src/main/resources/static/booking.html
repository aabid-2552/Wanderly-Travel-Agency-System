<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Trip | Wanderly</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">Wander<span>ly</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="contact.html">Contact Us</a>
  </div>
  <div class="nav-actions" id="nav-auth-area"></div>
</nav>

<div class="form-wrapper" style="max-width:520px;">
  <h2>Complete Your Booking</h2>
  <p class="subtitle" id="package-summary">Loading package details...</p>

  <div class="alert alert-error" id="error-box"></div>
  <div class="alert alert-success" id="success-box"></div>

  <form id="booking-form">
    <div class="form-group">
      <label>Travel Date</label>
      <input type="date" id="travelDate" required>
    </div>
    <div class="form-group">
      <label>Number of People</label>
      <input type="number" id="numberOfPeople" min="1" value="1" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Confirm Booking</button>
  </form>
</div>

<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const packageId = params.get("packageId");
  let currentPackage = null;

  if (!packageId) {
    document.getElementById("package-summary").textContent = "No package selected. Please choose a package first.";
  }

  async function loadPackage() {
    try {
      currentPackage = await apiFetch(`/packages/${packageId}`, { method: "GET" });
      document.getElementById("package-summary").innerHTML =
        `Booking <strong style="color:var(--accent)">${currentPackage.title}</strong> — $${currentPackage.price} / person`;
    } catch (err) {
      document.getElementById("package-summary").textContent = err.message;
    }
  }
  if (packageId) loadPackage();

  document.getElementById("booking-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");
    errorBox.classList.remove("show");
    successBox.classList.remove("show");

    if (!Auth.isLoggedIn()) {
      window.location.href = "login.html?redirect=" + encodeURIComponent(window.location.href);
      return;
    }

    const travelDate = document.getElementById("travelDate").value;
    const numberOfPeople = parseInt(document.getElementById("numberOfPeople").value, 10);

    try {
      await apiFetch("/bookings", {
        method: "POST",
        body: JSON.stringify({ packageId: parseInt(packageId, 10), travelDate, numberOfPeople })
      });
      successBox.textContent = "Booking confirmed! Redirecting to your bookings...";
      successBox.classList.add("show");
      setTimeout(() => window.location.href = "my-bookings.html", 1200);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
    }
  });
</script>
</body>
</html>
