<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Wanderly</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">Wander<span>ly</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="contact.html">Contact Us</a>
  </div>
  <div class="nav-actions" id="nav-auth-area"></div>
</nav>

<section class="section">
  <div class="section-header" style="margin-bottom:20px; text-align:left; max-width:100%;">
    <div class="tag">Admin</div>
    <h2>Dashboard</h2>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="packages">Manage Packages</button>
    <button class="tab-btn" data-tab="bookings">All Bookings</button>
    <button class="tab-btn" data-tab="messages">Contact Messages</button>
  </div>

  <!-- PACKAGES TAB -->
  <div class="tab-content active" id="tab-packages">
    <div class="form-wrapper" style="margin: 0 0 30px; max-width: 100%;">
      <h2 id="package-form-title">Add New Package</h2>
      <div class="alert alert-error" id="package-error"></div>
      <div class="alert alert-success" id="package-success"></div>
      <form id="package-form">
        <input type="hidden" id="package-id">
        <div class="form-row">
          <div class="form-group"><label>Title</label><input type="text" id="p-title" required></div>
          <div class="form-group"><label>Location</label><input type="text" id="p-location"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Category</label><input type="text" id="p-category" placeholder="Beach, Adventure, Wildlife..."></div>
          <div class="form-group"><label>Price (USD)</label><input type="number" id="p-price" min="0" step="0.01" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Duration (days)</label><input type="number" id="p-duration" min="1"></div>
          <div class="form-group"><label>Image URL</label><input type="text" id="p-image" placeholder="https://..."></div>
        </div>
        <div class="form-group"><label>Description</label><textarea id="p-description" rows="3"></textarea></div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary" id="package-submit-btn">Add Package</button>
          <button type="button" class="btn btn-outline hidden" id="package-cancel-btn">Cancel Edit</button>
        </div>
      </form>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Title</th><th>Location</th><th>Category</th><th>Price</th><th>Days</th><th>Actions</th></tr></thead>
        <tbody id="packages-body"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- BOOKINGS TAB -->
  <div class="tab-content" id="tab-bookings">
    <div class="table-wrap">
      <table>
        <thead><tr><th>User</th><th>Package</th><th>Travel Date</th><th>People</th><th>Status</th><th>Update</th></tr></thead>
        <tbody id="bookings-body"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- MESSAGES TAB -->
  <div class="tab-content" id="tab-messages">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th></tr></thead>
        <tbody id="messages-body"><tr><td colspan="4" class="empty-state">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</section>

<script src="js/api.js"></script>
<script>
  // Guard: only logged-in admins can access this page
  if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
    window.location.href = "login.html?redirect=admin.html";
  }

  // Tabs
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  // ---------------- PACKAGES ----------------
  async function loadPackages() {
    const body = document.getElementById("packages-body");
    try {
      const packages = await apiFetch("/packages", { method: "GET" });
      if (packages.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="empty-state">No packages yet.</td></tr>';
        return;
      }
      body.innerHTML = packages.map(p => `
        <tr>
          <td>${p.title}</td>
          <td>${p.location || '-'}</td>
          <td>${p.category || '-'}</td>
          <td>$${p.price}</td>
          <td>${p.durationDays || '-'}</td>
          <td>
            <button class="btn btn-outline btn-small" onclick='editPackage(${JSON.stringify(p)})'>Edit</button>
            <button class="btn btn-danger btn-small" onclick="deletePackage(${p.id})">Delete</button>
          </td>
        </tr>
      `).join("");
    } catch (err) {
      body.innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
    }
  }

  function editPackage(p) {
    document.getElementById("package-id").value = p.id;
    document.getElementById("p-title").value = p.title || "";
    document.getElementById("p-location").value = p.location || "";
    document.getElementById("p-category").value = p.category || "";
    document.getElementById("p-price").value = p.price || "";
    document.getElementById("p-duration").value = p.durationDays || "";
    document.getElementById("p-image").value = p.imageUrl || "";
    document.getElementById("p-description").value = p.description || "";
    document.getElementById("package-form-title").textContent = "Edit Package";
    document.getElementById("package-submit-btn").textContent = "Update Package";
    document.getElementById("package-cancel-btn").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetPackageForm() {
    document.getElementById("package-form").reset();
    document.getElementById("package-id").value = "";
    document.getElementById("package-form-title").textContent = "Add New Package";
    document.getElementById("package-submit-btn").textContent = "Add Package";
    document.getElementById("package-cancel-btn").classList.add("hidden");
  }

  document.getElementById("package-cancel-btn").addEventListener("click", resetPackageForm);

  document.getElementById("package-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("package-error");
    const successBox = document.getElementById("package-success");
    errorBox.classList.remove("show");
    successBox.classList.remove("show");

    const id = document.getElementById("package-id").value;
    const payload = {
      title: document.getElementById("p-title").value.trim(),
      location: document.getElementById("p-location").value.trim(),
      category: document.getElementById("p-category").value.trim(),
      price: parseFloat(document.getElementById("p-price").value),
      durationDays: parseInt(document.getElementById("p-duration").value, 10) || null,
      imageUrl: document.getElementById("p-image").value.trim(),
      description: document.getElementById("p-description").value.trim()
    };

    try {
      if (id) {
        await apiFetch(`/packages/${id}`, { method: "PUT", body: JSON.stringify(payload) });
        successBox.textContent = "Package updated!";
      } else {
        await apiFetch("/packages", { method: "POST", body: JSON.stringify(payload) });
        successBox.textContent = "Package added!";
      }
      successBox.classList.add("show");
      resetPackageForm();
      loadPackages();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
    }
  });

  async function deletePackage(id) {
    if (!confirm("Delete this package?")) return;
    try {
      await apiFetch(`/packages/${id}`, { method: "DELETE" });
      loadPackages();
    } catch (err) {
      alert(err.message);
    }
  }

  // ---------------- BOOKINGS ----------------
  async function loadBookings() {
    const body = document.getElementById("bookings-body");
    try {
      const bookings = await apiFetch("/bookings/all", { method: "GET" });
      if (bookings.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="empty-state">No bookings yet.</td></tr>';
        return;
      }
      body.innerHTML = bookings.map(b => `
        <tr>
          <td>${b.user.fullName}<br><small style="color:var(--text-muted)">${b.user.email}</small></td>
          <td>${b.tourPackage.title}</td>
          <td>${b.travelDate}</td>
          <td>${b.numberOfPeople}</td>
          <td><span class="badge badge-${b.status.toLowerCase()}">${b.status}</span></td>
          <td>
            <select onchange="updateBookingStatus(${b.id}, this.value)">
              <option value="">Change status...</option>
              <option value="PENDING">Pending</option>
              <option value="CONFIRMED">Confirmed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </td>
        </tr>
      `).join("");
    } catch (err) {
      body.innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
    }
  }

  async function updateBookingStatus(id, status) {
    if (!status) return;
    try {
      await apiFetch(`/bookings/${id}/status`, { method: "PUT", body: JSON.stringify({ status }) });
      loadBookings();
    } catch (err) {
      alert(err.message);
    }
  }

  // ---------------- CONTACT MESSAGES ----------------
  async function loadMessages() {
    const body = document.getElementById("messages-body");
    try {
      const messages = await apiFetch("/contact", { method: "GET" });
      if (messages.length === 0) {
        body.innerHTML = '<tr><td colspan="4" class="empty-state">No messages yet.</td></tr>';
        return;
      }
      body.innerHTML = messages.map(m => `
        <tr>
          <td>${m.name}</td>
          <td>${m.email}</td>
          <td>${m.subject || '-'}</td>
          <td>${m.message}</td>
        </tr>
      `).join("");
    } catch (err) {
      body.innerHTML = `<tr><td colspan="4" class="empty-state">${err.message}</td></tr>`;
    }
  }

  loadPackages();
  loadBookings();
  loadMessages();
</script>
</body>
</html>
