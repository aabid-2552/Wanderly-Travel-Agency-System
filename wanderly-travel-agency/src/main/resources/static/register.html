<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Wanderly</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">Wander<span>ly</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="contact.html">Contact Us</a>
  </div>
  <div class="nav-actions" id="nav-auth-area"></div>
</nav>

<div class="form-wrapper">
  <h2>Create Your Account</h2>
  <p class="subtitle">Register to start booking your dream trips.</p>

  <div class="alert alert-error" id="error-box"></div>
  <div class="alert alert-success" id="success-box"></div>

  <form id="register-form">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="fullName" required placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>

  <div class="form-footer-link">
    Already have an account? <a href="login.html">Login here</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");
    errorBox.classList.remove("show");
    successBox.classList.remove("show");

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await apiFetch("/auth/register", {
        method: "POST",
        body: JSON.stringify({ fullName, email, password })
      });
      successBox.textContent = "Account created successfully! Redirecting to login...";
      successBox.classList.add("show");
      setTimeout(() => window.location.href = "login.html", 1200);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
    }
  });
</script>
</body>
</html>
