spring.application.name=travel-agency-backend
server.port=8080

# H2 in-memory database (data resets every restart, seeded with sample data)
spring.datasource.url=jdbc:h2:mem:travelagencydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings
jwt.secret=ThisIsASecretKeyForTravelAgencyJWTTokenGenerationChangeItInProd123456
jwt.expiration.ms=86400000

# CORS - allow frontend (opened via file:// or a static server) to call the API
app.cors.allowed-origins=*
